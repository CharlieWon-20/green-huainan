<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>融圈行动：淮南的绿色蝶变</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --bg-color: #2c3e50;
            --text-color: #ecf0f1;
            --panel-bg: rgba(255, 255, 255, 0.1);
            --btn-action: #7f8c8d;
            --btn-upgrade: #e74c3c;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); color: var(--text-color);
            transition: all 1s ease; margin: 0; padding: 10px; min-height: 100vh;
            box-sizing: border-box;
        }
        
        .chapter-1 { --bg-color: #2c3e50; --text-color: #ecf0f1; --panel-bg: rgba(0,0,0,0.4); --btn-action: #5a6667; --btn-upgrade: #c0392b; }
        .chapter-2 { --bg-color: #e67e22; --text-color: #2c3e50; --panel-bg: rgba(255,255,255,0.8); --btn-action: #d35400; --btn-upgrade: #2980b9; }
        .chapter-3 { --bg-color: #a3e4d7; --text-color: #0b5345; --panel-bg: rgba(255,255,255,0.85); --btn-action: #16a085; --btn-upgrade: #27ae60; }

        .container { 
            max-width: 900px; margin: 0 auto; background: var(--panel-bg); 
            padding: 15px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(10px); transition: all 1s ease;
        }

        h1 { text-align: center; font-size: 1.4em; margin: 10px 0; }
        h3 { text-align: center; font-size: 1.1em; margin-bottom: 5px; }
        .header-info { text-align: center; font-size: 0.9em; margin-bottom: 15px; color: #f1c40f;}
        .chapter-2 .header-info, .chapter-3 .header-info { color: #d35400; }

        /* 数据仪表盘：手机上改为2列 */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .stat-card { 
            background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; text-align: center;
        }
        .chapter-2 .stat-card, .chapter-3 .stat-card { background: rgba(255,255,255,0.6); }
        .stat-value { font-size: 1.4em; font-weight: bold; margin: 3px 0; }
        
        progress { width: 100%; height: 8px; border-radius: 4px; }

        /* 游戏区域布局：移动端核心改动 */
        .game-area { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) {
            .game-area { flex-direction: row; }
            h1 { font-size: 2em; }
            .container { padding: 30px; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .controls { flex: 1; }
        .logs-panel { flex: 1; }

        .btn { 
            display: block; width: 100%; padding: 16px 10px; margin-bottom: 12px; border: none; 
            border-radius: 8px; font-size: 0.95em; cursor: pointer; transition: 0.2s; font-weight: bold;
            line-height: 1.4; box-sizing: border-box;
        }
        .btn-upgrade { background-color: var(--btn-upgrade); color: white; border: 2px dashed rgba(255,255,255,0.5); }
        .btn-action { background-color: var(--btn-action); color: white; }
        
        .logs { 
            height: 300px; overflow-y: auto; background: rgba(0,0,0,0.7); 
            color: #ecf0f1; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85em;
        }

        /* 规则弹窗适配 */
        .modal-content {
            background: #fff; color: #333; width: 85%; max-width: 500px; padding: 25px;
            border-radius: 15px; max-height: 85vh; overflow-y: auto;
        }
        .modal-content h2 { font-size: 1.3em; }
        .modal-content ul { font-size: 0.9em; padding-left: 15px; }
    </style>
</head>
<body id="app" :class="'chapter-' + chapter">

    <div v-if="showRules" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="modal-content">
            <h2>📜 执政官手册</h2>
            <p>通过科学决策，带领淮南实现绿色高质量发展。</p>
            <ul>
                <li><strong>💰 资金：</strong> 执政的基础。</li>
                <li><strong>🌱 生态：</strong> 警戒线10，过低会被罚款。</li>
                <li><strong>❤️ 民心：</strong> 警戒线10，代表执政稳定。</li>
                <li><strong>🔬 科技：</strong> 产业升级的关键。</li>
            </ul>
            <button style="background: #e67e22; color: white; padding: 12px 0; border: none; border-radius: 25px; width: 100%; font-weight: bold;" @click="showRules = false">进入执政</button>
        </div>
    </div>

    <div class="container">
        <h1>融圈行动</h1>
        <h3>{{ chapterName }}</h3>
        <div class="header-info">📅 第 {{ year }} 年 {{ month }} 月</div>

        <div class="stats-grid">
            <div class="stat-card"><div>💰 资金</div><div class="stat-value">{{ funds }}</div></div>
            <div class="stat-card"><div>🌱 生态</div><div class="stat-value">{{ ecology }}</div><progress :value="ecology" max="100"></progress></div>
            <div class="stat-card"><div>❤️ 民心</div><div class="stat-value">{{ support }}</div><progress :value="support" max="100"></progress></div>
            <div class="stat-card"><div>🔬 科技</div><div class="stat-value">{{ tech }}</div><progress :value="tech" max="200"></progress></div>
        </div>

        <div class="game-area">
            <div class="controls">
                <template v-if="chapter === 1">
                    <button class="btn btn-action" @click="doAction(300, -12, 0, 0, '⛏️ 粗放开采原煤 (资金+300, 生态-12)')">⛏️ 粗放开采原煤 (资金+300, 生态-12)</button>
                    <button class="btn btn-action" :disabled="funds < 500" @click="doAction(-500, 20, 5, 0, '🌳 治理沉陷区 (资金-500, 生态+20)')">🌳 治理沉陷区 (资金-500, 生态+20)</button>
                    <button class="btn btn-action" @click="doAction(50, 0, 10, 0, '🍲 举办豆腐文化节 (资金+50, 民心+10)')">🍲 举办豆腐文化节 (资金+50, 民心+10)</button>
                    <button class="btn btn-upgrade" :disabled="funds < 1500 || tech < 30 || support < 40" @click="upgradeChapter(2)">🚆 贯通商合杭高铁 (需1500资金) ➔ 第二篇章</button>
                </template>

                <template v-if="chapter === 2">
                    <button class="btn btn-action" @click="doAction(800, -15, -5, 0, '🏭 承接落后产能 (资金+800, 生态-15)')">🏭 承接落后产能 (资金+800, 生态-15)</button>
                    <button class="btn btn-action" :disabled="funds < 1000" @click="doAction(-1000, -5, 10, 25, '🔋 布局新能车链 (资金-1000, 科技+25)')">🔋 布局新能车链 (资金-1000, 科技+25)</button>
                    <button class="btn btn-action" @click="doAction(200, 5, 5, 0, '🌾 特色农产供沪 (资金+200, 生态+5)')">🌾 特色农产供沪 (资金+200, 生态+5)</button>
                    <button class="btn btn-upgrade" :disabled="funds < 6000 || tech < 100 || ecology < 50" @click="upgradeChapter(3)">☀️ 攻坚光伏技术 (需6000资金) ➔ 第三篇章</button>
                </template>

                <template v-if="chapter === 3">
                    <button class="btn btn-action" :disabled="funds < 1500" @click="doAction(-1500, 25, 10, 20, '🌊 建设水面光伏 (资金-1500, 生态+25)')">🌊 建设水面光伏 (资金-1500, 生态+25)</button>
                    <button class="btn btn-action" :disabled="ecology < 60 || tech < 120" @click="doAction(2500, -5, 15, 0, '⚡ 特高压绿电入沪 (资金+2500, 民心+15)')">⚡ 特高压绿电入沪 (资金+2500, 民心+15)</button>
                    <button class="btn btn-upgrade" v-if="ecology >= 100 && support >= 100 && tech >= 200 && funds >= 10000" @click="winGame">🏆 达成高质量发展标杆 ➔ 通关</button>
                </template>
            </div>

            <div class="logs-panel">
                <div class="logs" id="logContainer">
                    <div v-for="(log, index) in logs" :key="index" style="margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:4px;">
                        <span style="opacity:0.6">[{{ log.time }}]</span> {{ log.text }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, nextTick } = Vue;
        createApp({
            setup() {
                const showRules = ref(true);
                const chapter = ref(1);
                const year = ref(2010), month = ref(1);
                const funds = ref(1000), ecology = ref(40), support = ref(50), tech = ref(0);
                const logs = ref([]);
                const chapterNames = {1: "第一篇章：黑金时代的余晖", 2: "第二篇章：大动脉的跳动", 3: "第三篇章：绿水青山的馈赠"};
                const chapterName = computed(() => chapterNames[chapter.value]);

                const addLog = (text) => {
                    logs.value.push({ time: `${year.value}年${month.value}月`, text });
                    nextTick(() => { const c = document.getElementById('logContainer'); if(c) c.scrollTop = c.scrollHeight; });
                };

                const doAction = (f, e, s, t, log) => {
                    funds.value += f; ecology.value += e; support.value += s; tech.value += t;
                    if(ecology.value > 100) ecology.value = 100; if(support.value > 100) support.value = 100;
                    if(ecology.value <= 10) { funds.value -= 500; ecology.value = 20; addLog("⚠️ 环保处罚：扣除500资金！"); }
                    addLog(log); month.value++; if(month.value > 12){ month.value = 1; year.value++; }
                };

                const upgradeChapter = (target) => {
                    chapter.value = target; funds.value -= (target === 2 ? 1500 : 6000);
                    addLog(`🎉 跨入${chapterNames[target]}！`);
                };

                const winGame = () => { alert("恭喜通关！淮南已实现绿色蝶变！"); };

                return { showRules, chapter, year, month, chapterName, funds, ecology, support, tech, logs, doAction, upgradeChapter, winGame };
            }
        }).mount('#app');
    </script>
</body>
</html>
